# Values for the standalone prometheus-community/prometheus-adapter chart.
#
# NOTE: kube-prometheus-stack 9x+ no longer bundles a prometheus-adapter
# subchart — an overlay nested under "prometheus-adapter:" in the
# kube-prometheus-stack values is silently ignored (the upgrade "succeeds"
# without rendering any adapter manifests). Install the adapter as its own
# release instead:
#
#   helm upgrade --install prometheus-adapter prometheus-community/prometheus-adapter \
#     -n monitoring -f values-prometheus-adapter.yaml --version 5.3.0
#
# The adapter exposes two per-pod custom metrics:
#   api_requests_per_minute      = sum(rate(http_requests_total{route!="/health"}[2m])) * 60
#   frontend_requests_per_minute = sum(rate(nginx_http_requests_total[2m])) * 60
# consumed by the AstroLumina HPAs as their scaling signal (target: 20
# requests/minute per pod). The API rule excludes route="/health" so
# healthcheck traffic cannot pin replica count; the frontend rule counts
# everything Nginx sees (kubelet probes included: ~6/min floor, well below
# the 20/min target).

prometheus:
  url: http://monitoring-kube-prometheus-prometheus.monitoring.svc
  port: 9090

rules:
  default: true
  custom:
    - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: '^http_requests_total$'
        as: api_requests_per_minute
      metricsQuery: 'sum by (<<.GroupBy>>) (rate(http_requests_total{route!="/health",<<.LabelMatchers>>}[2m])) * 60'
    - seriesQuery: 'nginx_http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: '^nginx_http_requests_total$'
        as: frontend_requests_per_minute
      metricsQuery: 'sum by (<<.GroupBy>>) (rate(nginx_http_requests_total{<<.LabelMatchers>>}[2m])) * 60'

# The first live run OOMKilled and liveness-restarted under the old
# 250m/192Mi limits (exit code 137 plus probe timeouts) while the HPAs
# depended on its custom metrics API — give it real headroom.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Probe overrides (chart defaults: timeoutSeconds 5 / failureThreshold 3).
# /healthz is served by the same process that answers metric queries, so
# tolerate occasionally slow responses instead of SIGKILLing a busy adapter.
livenessProbe:
  httpGet:
    path: /healthz
    port: https
    scheme: HTTPS
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /healthz
    port: https
    scheme: HTTPS
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6
