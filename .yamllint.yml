# Yamllint config: relaxed style with a wider line limit for long
# comment lines in the manifests.
extends: relaxed

# Dashboard YAML files embed single-line Grafana JSON (long un-wrappable
# lines), so they are excluded from this repo-root lint run and carry their
# own config: use them from within the folder (`cd dashboards && yamllint .`).
# CI lint/build coverage for dashboards is a planned follow-up.
ignore: |
  dashboards/

rules:
  line-length:
    max: 220
