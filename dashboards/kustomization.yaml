---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AstroLumina custom Grafana dashboards.
# Deploy with: kubectl apply -k dashboards/ (from the repo root, on the CP).
# The Grafana sidecar picks up ConfigMaps labeled grafana_dashboard: "1"
# and loads them into the "AstroLumina" folder.
namespace: monitoring

resources:
  - frontend-dashboard.yaml
  - astrology-dashboard.yaml
  - booking-dashboard.yaml
  - payment-dashboard.yaml
