# AstroLumina custom dashboard, auto-loaded by the Grafana sidecar
# (grafana_dashboard: "1" label, folder: AstroLumina).
apiVersion: v1
kind: ConfigMap
metadata:
  name: astrology-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: AstroLumina
data:
  astrology.json: |-
    {
      "uid": "astrolumina-astrology",
      "title": "AstroLumina Astrology API",
      "tags": [
        "astrolumina"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "ds",
            "label": "Datasource",
            "type": "datasource",
            "query": {
              "type": "prometheus",
              "query": "prometheus"
            },
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1,
            "options": []
          },
          {
            "name": "env",
            "label": "Environment",
            "type": "custom",
            "query": "development,staging,production",
            "current": {
              "text": "production",
              "value": "production"
            },
            "options": [
              {
                "selected": false,
                "value": "development",
                "text": "development"
              },
              {
                "selected": false,
                "value": "staging",
                "text": "staging"
              },
              {
                "selected": true,
                "value": "production",
                "text": "production"
              }
            ],
            "hide": 0,
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": null,
          "title": "HPA replicas (current vs desired)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "description": "Feeds on the per-pod custom metric api_requests_per_minute (target 20 req/min per pod).",
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"astrolumina-$env\",horizontalpodautoscaler=~\"astrology.*\"}",
              "legendFormat": "current",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=~\"astrolumina-$env\",horizontalpodautoscaler=~\"astrology.*\"}",
              "legendFormat": "desired",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": null,
          "title": "Pods ready / desired",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "description": "",
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_ready{namespace=~\"astrolumina-$env\",deployment=~\"astrology.*\"}",
              "legendFormat": "ready",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            },
            {
              "refId": "B",
              "expr": "kube_deployment_spec_replicas{namespace=~\"astrolumina-$env\",deployment=~\"astrology.*\"}",
              "legendFormat": "desired",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": null,
          "type": "stat",
          "title": "Success rate (2xx)",
          "description": "Share of 2xx among non-health requests (5m).",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 95
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"2..\"}[5m])) / sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\"}[5m])) * 100) and (sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\"}[5m])) > 0)",
              "legendFormat": "Success rate (2xx)",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": null,
          "type": "stat",
          "title": "Error rate (5xx)",
          "description": "Share of 5xx among non-health requests (5m).",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\"}[5m])) * 100) and (sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\"}[5m])) > 0)",
              "legendFormat": "Error rate (5xx)",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": null,
          "type": "stat",
          "title": "Latency p95 (now)",
          "description": "p95 request duration over the last 5m.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.3
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"astrology-api\",namespace=~\"astrolumina-$env\"}[5m])))",
              "legendFormat": "Latency p95 (now)",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": null,
          "title": "Requests / min per pod (excl. /health)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "description": "Mirrors the api_requests_per_minute custom metric consumed by the HPA (target 20/min per pod).",
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\"}[2m])) * 60",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": null,
          "title": "Requests / min total (excl. /health)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "description": "",
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\"}[2m])) * 60",
              "legendFormat": "astrology-api",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": null,
          "title": "Requests / min by status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 12
          },
          "description": "",
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\"}[2m])) * 60",
              "legendFormat": "{{status}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": null,
          "type": "timeseries",
          "title": "Status classes (2xx / 3xx / 4xx / 5xx)",
          "description": "Request rate by HTTP status class (excludes /health). 3xx/5xx appear when such responses occur.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 30,
                "gradientMode": "opacity",
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                },
                "spanNulls": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "2xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#73BF69"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "3xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#5794F2"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "4xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#FF9830"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "5xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#F2495C"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"2..\"}[2m])) * 60",
              "legendFormat": "2xx"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"3..\"}[2m])) * 60",
              "legendFormat": "3xx"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"4..\"}[2m])) * 60",
              "legendFormat": "4xx"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"5..\"}[2m])) * 60",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": null,
          "type": "piechart",
          "title": "Status classes - share (selected range)",
          "description": "Share of requests by status class over the dashboard time range (excludes /health).",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "2xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#73BF69"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "3xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#5794F2"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "4xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#FF9830"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "5xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#F2495C"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "pieType": "donut",
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "values": [
                "value",
                "percent"
              ]
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            },
            "displayLabels": [
              "percent"
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "instant": true,
              "expr": "sum(increase(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"2..\"}[$__range]))",
              "legendFormat": "2xx"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "instant": true,
              "expr": "sum(increase(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"3..\"}[$__range]))",
              "legendFormat": "3xx"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "instant": true,
              "expr": "sum(increase(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"4..\"}[$__range]))",
              "legendFormat": "4xx"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "instant": true,
              "expr": "sum(increase(http_requests_total{service=\"astrology-api\",namespace=~\"astrolumina-$env\",route!=\"/health\",status=~\"5..\"}[$__range]))",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": null,
          "title": "Latency p50 / p95 / p99",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "description": "",
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"astrology-api\",namespace=~\"astrolumina-$env\"}[5m])))",
              "legendFormat": "p50",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"astrology-api\",namespace=~\"astrolumina-$env\"}[5m])))",
              "legendFormat": "p95",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"astrology-api\",namespace=~\"astrolumina-$env\"}[5m])))",
              "legendFormat": "p99",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": null,
          "type": "heatmap",
          "title": "Latency distribution (heatmap)",
          "description": "Request duration distribution from http_request_duration_seconds buckets.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "calculate": false,
            "color": {
              "mode": "scheme",
              "scheme": "Spectral",
              "reverse": true,
              "steps": 64
            },
            "cellGap": 1,
            "yAxis": {
              "axisPlacement": "left",
              "unit": "s"
            },
            "tooltip": {
              "mode": "single",
              "show": true
            },
            "legend": {
              "show": true
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "format": "heatmap",
              "expr": "sum by (le) (rate(http_request_duration_seconds_bucket{service=\"astrology-api\",namespace=~\"astrolumina-$env\"}[$__rate_interval]))",
              "legendFormat": "{{le}}"
            }
          ]
        },
        {
          "id": null,
          "title": "Top 5 routes by req/min (excl. /health)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
