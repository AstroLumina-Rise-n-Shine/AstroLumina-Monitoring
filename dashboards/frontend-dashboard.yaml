# AstroLumina custom dashboard, auto-loaded by the Grafana sidecar
# (grafana_dashboard: "1" label, folder: AstroLumina).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: AstroLumina
data:
  frontend.json: |-
    {
      "uid": "astrolumina-frontend",
      "title": "AstroLumina Frontend",
      "tags": [
        "astrolumina"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "ds",
            "label": "Datasource",
            "type": "datasource",
            "query": {
              "type": "prometheus",
              "query": "prometheus"
            },
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1,
            "options": []
          },
          {
            "name": "env",
            "label": "Environment",
            "type": "custom",
            "query": "development,staging,production",
            "current": {
              "text": "production",
              "value": "production"
            },
            "options": [
              {
                "selected": false,
                "value": "development",
                "text": "development"
              },
              {
                "selected": false,
                "value": "staging",
                "text": "staging"
              },
              {
                "selected": true,
                "value": "production",
                "text": "production"
              }
            ],
            "hide": 0,
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": null,
          "title": "HPA replicas (current vs desired)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "description": "Frontend HPA: frontend_requests_per_minute (Nginx request rate per pod, 20/min target, via the nginx-prometheus-exporter sidecar) plus CPU.",
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"astrolumina-$env\",horizontalpodautoscaler=~\"frontend.*\"}",
              "legendFormat": "current",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=~\"astrolumina-$env\",horizontalpodautoscaler=~\"frontend.*\"}",
              "legendFormat": "desired",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": null,
          "title": "Pods ready / desired",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "description": "",
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_ready{namespace=~\"astrolumina-$env\",deployment=~\"frontend.*\"}",
              "legendFormat": "ready",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            },
            {
              "refId": "B",
              "expr": "kube_deployment_spec_replicas{namespace=~\"astrolumina-$env\",deployment=~\"frontend.*\"}",
              "legendFormat": "desired",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": null,
          "type": "stat",
          "title": "HPA signal - avg requests/min per pod (target 20)",
          "description": "Same signal the HPA uses to scale the frontend (frontend_requests_per_minute).",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 15
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(nginx_http_requests_total{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"}[2m])) * 60 / count(count by (pod) (nginx_http_requests_total{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"}))",
              "legendFormat": "HPA signal - avg requests/min per pod (target 20)",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": null,
          "type": "stat",
          "title": "Nginx exporter health (nginx_up)",
          "description": "1 = exporter scrapes nginx stub_status OK (one value per live pod).",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nginx_up{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"}",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": null,
          "title": "Requests per minute (per pod)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "description": "nginx_http_requests_total, stub_status scraped by the exporter sidecar. Includes kubelet probes (~6/min floor). HPA target: 20/min per pod.",
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(nginx_http_requests_total{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"}[5m])) * 60",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              },
              "custom": {
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": null,
          "type": "timeseries",
          "title": "Connections by state (reading / writing / waiting)",
          "description": "nginx stub_status connection states (waiting = idle keep-alive).",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 25,
                "gradientMode": "opacity",
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                },
                "spanNulls": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "reading"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#5794F2"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "writing"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#FF9830"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "waiting"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#8AB8FF"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(nginx_connections_reading{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"})",
              "legendFormat": "reading"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(nginx_connections_writing{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"})",
              "legendFormat": "writing"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(nginx_connections_waiting{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"})",
              "legendFormat": "waiting"
            }
          ]
        },
        {
          "id": null,
          "title": "Active connections",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "description": "nginx_connections_active (active + reading + writing + waiting).",
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (nginx_connections_active{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": null,
          "type": "timeseries",
          "title": "Connections accepted vs handled (per min)",
          "description": "A growing gap between accepted and handled connections indicates nginx resource exhaustion.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "accepted"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#5794F2"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "handled"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#73BF69"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(nginx_connections_accepted{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"}[5m])) * 60",
              "legendFormat": "accepted"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(nginx_connections_handled{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"}[5m])) * 60",
              "legendFormat": "handled"
            }
          ]
        },
        {
          "id": null,
          "title": "CPU per pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "description": "",
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\",container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": null,
          "title": "Memory working set per pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "description": "",
          "targets": [
            {
              "refId": "A",
              "expr": "container_memory_working_set_bytes{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\",container!=\"\"}",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": null,
          "title": "Restarts last 1h",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "description": "",
          "targets": [
            {
              "refId": "A",
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"astrolumina-$env\",pod=~\"frontend.*\"}[1h])",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 5,
          "title": "About frontend traffic",
          "type": "text",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "mode": "markdown",
          "content": "The frontend exposes **Nginx stub_status** through the `nginx-prometheus-exporter` sidecar (staging/production), so request traffic and connections are visible above.\n\n`nginx_http_requests_total` counts every request the Nginx worker sees, including kubelet probes (~6/min) — the HPA target is **20 requests/minute per pod** (`frontend_requests_per_minute`).\n\nDevelopment runs no monitoring stack (ArgoCD only), so these panels stay empty if `$env=development` is selected.",
          "options": {
            "mode": "markdown",
            "content": "### Frontend traffic metrics\n\nMetrics come from **nginx stub_status** via the `nginx-prometheus-exporter` sidecar.\n\n- **Available:** total requests, active connections, connection states - the HPA scales on `frontend_requests_per_minute` (target **20/min per pod**, includes a ~6/min kubelet-probe floor).\n- **Not available:** per-status-code counts and request latency (stub_status does not expose them; see the API dashboards for those)."
          }
        }
      ]
    }
