# AstroLumina custom dashboard, auto-loaded by the Grafana sidecar
# (grafana_dashboard: "1" label, folder: AstroLumina).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: AstroLumina
data:
  frontend.json: "{\n  \"uid\": \"astrolumina-frontend\",\n  \"title\": \"AstroLumina Frontend\",\n  \"tags\": [\n    \"astrolumina\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 41,\n  \"\
    version\": 1,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"ds\",\n        \"label\"\
    : \"Datasource\",\n        \"type\": \"datasource\",\n        \"query\": {\n          \"type\": \"prometheus\",\n          \"query\": \"prometheus\"\n        },\n        \"current\": {\n          \"\
    text\": \"Prometheus\",\n          \"value\": \"prometheus\"\n        },\n        \"hide\": 0,\n        \"refresh\": 1,\n        \"options\": []\n      },\n      {\n        \"name\": \"env\",\n    \
    \    \"label\": \"Environment\",\n        \"type\": \"custom\",\n        \"query\": \"development,staging,production\",\n        \"current\": {\n          \"text\": \"production\",\n          \"value\"\
    : \"production\"\n        },\n        \"options\": [\n          {\n            \"selected\": false,\n            \"value\": \"development\",\n            \"text\": \"development\"\n          },\n  \
    \        {\n            \"selected\": false,\n            \"value\": \"staging\",\n            \"text\": \"staging\"\n          },\n          {\n            \"selected\": true,\n            \"value\"\
    : \"production\",\n            \"text\": \"production\"\n          }\n        ],\n        \"hide\": 0,\n        \"includeAll\": false,\n        \"multi\": false\n      }\n    ]\n  },\n  \"panels\":\
    \ [\n    {\n      \"id\": null,\n      \"title\": \"HPA replicas (current vs desired)\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${ds}\"\
    \n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"description\": \"Frontend traffic is not counted by the custom metric;\
    \ the HPA is driven by its own configured metric.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=~\\\
    \"frontend.*\\\"}\",\n          \"legendFormat\": \"current\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${ds}\"\n          }\n        },\n        {\n\
    \          \"refId\": \"B\",\n          \"expr\": \"kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=~\\\"frontend.*\\\"}\",\n          \"legendFormat\": \"desired\",\n \
    \         \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${ds}\"\n          }\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"\
    unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"\
    fields\": \"\",\n          \"values\": false\n        }\n      }\n    },\n    {\n      \"id\": null,\n      \"title\": \"Pods ready / desired\",\n      \"type\": \"stat\",\n      \"datasource\": {\n\
    \        \"type\": \"prometheus\",\n        \"uid\": \"${ds}\"\n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 0\n      },\n      \"description\"\
    : \"\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"kube_deployment_status_replicas_ready{deployment=~\\\"frontend.*\\\"}\",\n          \"legendFormat\": \"\
    ready\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${ds}\"\n          }\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"\
    kube_deployment_spec_replicas{deployment=~\\\"frontend.*\\\"}\",\n          \"legendFormat\": \"desired\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"\
    ${ds}\"\n          }\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n \
    \       \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      }\n    },\n    {\n      \"\
    id\": null,\n      \"title\": \"CPU per pod\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${ds}\"\n      },\n      \"gridPos\":\
    \ {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 4\n      },\n      \"description\": \"\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\"\
    : \"sum by (pod) (rate(container_cpu_usage_seconds_total{pod=~\\\"frontend.*\\\",container!=\\\"\\\"}[5m]))\",\n          \"legendFormat\": \"{{pod}}\",\n          \"datasource\": {\n            \"\
    type\": \"prometheus\",\n            \"uid\": \"${ds}\"\n          }\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\"\
    : []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\"\n      \
    \    ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"none\"\n        }\n      }\n    },\n    {\n      \"id\": null,\n      \"title\": \"Memory working set\
    \ per pod\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${ds}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\"\
    : 12,\n        \"x\": 12,\n        \"y\": 4\n      },\n      \"description\": \"\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"container_memory_working_set_bytes{pod=~\\\
    \"frontend.*\\\",container!=\\\"\\\"}\",\n          \"legendFormat\": \"{{pod}}\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${ds}\"\n          }\n\
    \        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n\
    \          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\"\
    : \"multi\",\n          \"sort\": \"none\"\n        }\n      }\n    },\n    {\n      \"id\": null,\n      \"title\": \"Restarts last 1h\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n\
    \        \"type\": \"prometheus\",\n        \"uid\": \"${ds}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 12\n      },\n      \"description\"\
    : \"\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"increase(kube_pod_container_status_restarts_total{pod=~\\\"frontend.*\\\"}[1h])\",\n          \"legendFormat\"\
    : \"{{pod}}\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${ds}\"\n          }\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\":\
    \ {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\
    ,\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"none\"\n        }\n      }\n    },\n  \
    \  {\n      \"id\": 5,\n      \"title\": \"About frontend traffic\",\n      \"type\": \"text\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${ds}\"\n      },\n  \
    \    \"gridPos\": {\n        \"h\": 6,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 20\n      },\n      \"mode\": \"markdown\",\n      \"content\": \"The frontend is a **static Nginx image\
    \ with no `/metrics` endpoint**, so it exports no `http_requests_total` and does not appear on the `api_requests_per_minute` custom metric.\\n\\nRequest traffic to the frontend is only visible through\
    \ **Traefik ingress metrics, which are not yet wired into this stack** (follow-up).\\n\\nMeanwhile the panels above come from node-exporter / kube-state-metrics / cAdvisor via kube-prometheus-stack.\"\
    \n    }\n  ]\n}"
