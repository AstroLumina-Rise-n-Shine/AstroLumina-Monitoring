---
# Scrapes the development APIs (namespace astrolumina-development) on their /metrics
# endpoints. The frontend is intentionally absent: it is static Nginx with no
# metrics endpoint (its traffic is visible via the Traefik metrics instead).
# The `release: monitoring` label must match the Prometheus
# serviceMonitorSelector (default of the kube-prometheus-stack release
# called `monitoring`); without it Prometheus ignores these objects.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: astrolumina-development-astrology-api
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: astrolumina
spec:
  namespaceSelector:
    matchNames:
      - astrolumina-development
  selector:
    matchLabels:
      app.kubernetes.io/name: astrology-api
      app.kubernetes.io/component: astrology-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
