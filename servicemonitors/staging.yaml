---
# Nginx metrics for the frontend (nginx-prometheus-exporter sidecar on the
# *-live Service, port 9113). Kept as its own ServiceMonitor so a missing
# target is easy to spot on the Prometheus targets page.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: astrolumina-staging-frontend
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: astrolumina
spec:
  namespaceSelector:
    matchNames:
      - astrolumina-staging
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: frontend
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      honorLabels: true
