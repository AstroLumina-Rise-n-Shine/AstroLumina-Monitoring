---
# Scrapes the staging LIVE color (namespace astrolumina-staging). Targeting
# the *-live Services (not blue/green directly) keeps the scrape target
# stable across blue/green flips. The frontend is included too: the
# nginx-prometheus-exporter sidecar serves its nginx_* metrics on the
# `metrics` port (9113) of the same *-live Service.
# The `release: monitoring` label must match the Prometheus
# serviceMonitorSelector (default of the kube-prometheus-stack release
# called `monitoring`); without it Prometheus ignores these objects.
# `honorLabels: true` below is intentional: it keeps each app's own
# `service="<app>"` label. With the default (false) the Operator's target
# label service=<svc-name> wins and the app's own label is renamed to
# exported_service — which silently breaks every dashboard/HPA query that
# filters on service="astrology-api" etc.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: astrolumina-staging-astrology-api
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: astrolumina
spec:
  namespaceSelector:
    matchNames:
      - astrolumina-staging
  selector:
    matchLabels:
      app.kubernetes.io/name: astrology-api
      app.kubernetes.io/component: astrology-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: astrolumina-staging-booking-api
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: astrolumina
spec:
